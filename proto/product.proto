syntax = "proto3";

package product;

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (Product);
  rpc FindProductById (ProductById) returns (Product);
  rpc FindProductsByCategory (CategoryId) returns (ProductList);
  rpc UpdateProduct (UpdateProductRequest) returns (Product);
  rpc DeleteProduct (ProductById) returns (Empty);
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  double price = 3;
  int32 category_id = 4;
}

message UpdateProductRequest {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 category_id = 5;
}

message Product {
  int32 id = 1;
  string name = 2;
  string description = 3;
  double price = 4;
  int32 category_id = 5;
}

message ProductById {
  int32 id = 1;
}

message CategoryId {
  int32 id = 1;
}

message ProductList {
  repeated Product products = 1;
}

message Empty {}